<script>
/* Garde-fou BacMaster : répare les données locales corrompues (ou venant d'un autre site de la même adresse
   github.io) avant que l'appli ne démarre, et propose un bouton « Réparer » si l'appli ne s'affiche pas. */
(function(){
  var KEYS={bacmaster_db:'o',my_db:'o',bacmaster_evals:'a',bacmaster_activity:'a',bacmaster_timelog:'o'};
  function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
  try{
    Object.keys(KEYS).forEach(function(k){
      var raw=localStorage.getItem(k); if(raw===null) return;
      var ok=false;
      try{
        var v=JSON.parse(raw);
        ok=KEYS[k]==='a'?Array.isArray(v):isObj(v);
        if(ok&&(k==='bacmaster_db'||k==='my_db')){
          for(var s in v){ if(!isObj(v[s])){ok=false;break;} for(var c in v[s]){ if(!isObj(v[s][c])){ok=false;break;} } if(!ok)break; }
        }
      }catch(e){ok=false;}
      if(!ok){ try{localStorage.setItem('bm_backup_'+k,raw);}catch(e){} try{localStorage.removeItem(k);}catch(e){} }
    });
  }catch(e){}
  var errs=[];
  window.addEventListener('error',function(ev){errs.push(ev.message||'Erreur');});
  window.addEventListener('unhandledrejection',function(ev){errs.push(String(ev.reason&&ev.reason.message||ev.reason||'Erreur'));});
  window.addEventListener('load',function(){
    setTimeout(function(){
      if(!errs.length||document.body.innerText.indexOf('Mes Matières')!==-1) return;
      var d=document.createElement('div');
      d.style.cssText='position:fixed;left:12px;right:12px;top:80px;z-index:99999;background:#fff;color:#111;border:2px solid #c0392b;border-radius:14px;padding:16px;font:15px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.25)';
      d.innerHTML='<b>BacMaster n’a pas pu démarrer.</b><br><small style="color:#555">'+String(errs[0]).replace(/</g,'&lt;')+'</small><br><br><button id="bm-fix" style="padding:10px 16px;border:0;border-radius:10px;background:#2c7be5;color:#fff;font-size:15px;cursor:pointer">🔧 Réparer et recharger</button>';
      document.body.appendChild(d);
      document.getElementById('bm-fix').onclick=async function(){
        try{Object.keys(KEYS).forEach(function(k){var r=localStorage.getItem(k);if(r!==null){try{localStorage.setItem('bm_backup_'+k,r);}catch(e){}localStorage.removeItem(k);}});}catch(e){}
        try{var regs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<regs.length;i++)await regs[i].unregister();}catch(e){}
        try{var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j]);}catch(e){}
        location.reload();
      };
    },2000);
  });
})();
</script>

<script>
/* Démarrage rapide : les cours (≈1,5 Mo) sont déjà enregistrés dans l'appareil après la 1re ouverture.
   Tant que leur version n'a pas changé, on ne les relit PAS au démarrage : on les charge en arrière-plan
   une fois l'accueil affiché (bm-contenu.js). Si les cours ont changé, ils sont chargés comme avant. */
(function(){
  var V='660424ef42d4';
  var files=['francais.js','maths.js','histoire-geo.js','anglais.js','espagnol.js','physique-chimie.js','ingenierie-dd.js','innovation-techno.js','informatique.js','informatique-code.js','informatique-parcours.js','cybersecurite.js','cybersecurite-plus.js','cybersecurite-parcours.js','investissement.js','investissement-pratique.js','entrepreneuriat.js','apprentissage.js','juridique.js'];
  var stored=null, hasDb=false;
  try{ stored=localStorage.getItem('bm_content_ver'); hasDb=(localStorage.getItem('bacmaster_db')||'').length>10; }catch(e){}
  window.BM_CONTENT_VER=V; window.BM_SUBJECT_FILES=files;
  window.BM_FAST_START=(stored===V && hasDb);
  window.BM_PREBUILT_READY=false;
  var waiting=[];
  window.bmWhenContentReady=function(cb){ if(window.BM_PREBUILT_READY) cb(); else waiting.push(cb); };
  window.bmContentReady=function(){ window.BM_PREBUILT_READY=true; var l=waiting; waiting=[]; l.forEach(function(cb){ try{cb();}catch(e){console.error(e);} }); };
  if(!window.BM_FAST_START){
    files.forEach(function(f){ document.write('<script src="'+f+'"><\/script>'); });
    window.bmContentReady();
  }
})();
</script>

<script>
/* La synchro (Supabase) se charge APRÈS l'affichage de l'appli : avant, ce script externe bloquait tout
   le démarrage tant que le réseau ne l'avait pas livré (20-30 s sur un mauvais réseau mobile). */
(function(){
  var started=false;
  function add(src){var s=document.createElement('script');s.src=src;s.async=false;document.body.appendChild(s);}
  function startSync(){if(started)return;started=true;window.bmWhenContentReady(function(){add('supabase-config.js');add('supabase-app.js');add('bm-collab.js');});}
  function loadLib(){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.async=true;
    var timeoutId=setTimeout(function(){
      // Ne pas initialiser supabase-app.js avant que la bibliothèque soit réellement chargée :
      // sinon son init() s'arrête définitivement et la synchronisation ne redémarre jamais.
      console.warn('[BacMaster] Le chargement de Supabase prend plus de 15 secondes.');
      if(typeof showToast==='function') showToast('La synchronisation met du temps à démarrer. Tes cours restent accessibles.', 'warn');
    },15000);
    s.onload=function(){
      clearTimeout(timeoutId);
      if(window.supabase && typeof window.supabase.createClient==='function') startSync();
      else console.error('[BacMaster] La bibliothèque Supabase est chargée mais createClient est indisponible.');
    };
    s.onerror=function(){
      clearTimeout(timeoutId);
      console.error('[BacMaster] Impossible de charger la bibliothèque Supabase. La synchronisation est indisponible pour le moment.');
      if(typeof showToast==='function') showToast('Connexion au service de synchronisation impossible. Vérifie ta connexion Internet.', 'warn');
    };
    document.body.appendChild(s);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(loadLib,0);});else setTimeout(loadLib,0);
})();
</script>

    <!-- Service Worker Registration -->
    <script>
    /* Mise à jour de l'appli : bouton dans le menu + bandeau quand une nouvelle version est prête */
    function bmUpdateNow(btn) {
        if (window.BacMasterGoal && BacMasterGoal.forceUpdate) return BacMasterGoal.forceUpdate(btn);
        location.reload();
    }
    function bmShowUpdateBanner() {
        const b = document.getElementById('sb-update'); if (b) b.classList.add('has-update');
        if (document.getElementById('bm-update-banner')) return;
        const d = document.createElement('div'); d.id = 'bm-update-banner'; d.className = 'bm-update-banner';
        d.innerHTML = '<button type="button" class="bm-update-go">🔄 <b>Mise à jour prête</b> · Installer</button><button type="button" class="bm-update-x" aria-label="Plus tard">✕</button>';
        d.querySelector('.bm-update-go').onclick = function () { this.textContent = '⏳ Mise à jour…'; bmUpdateNow(this); };
        d.querySelector('.bm-update-x').onclick = function () { d.remove(); };
        document.body.appendChild(d);
    }
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('[SW] Enregistré :', reg.scope);
                    // Recharge automatiquement quand une nouvelle version prend le contrôle
                    if (navigator.serviceWorker.controller) {
                        // Avant : la page se rechargeait toute seule dès qu'une mise à jour arrivait (≈ 15-30 s après
                        // l'ouverture) et ramenait à l'accueil en plein usage. Maintenant : rechargement immédiat
                        // seulement si tu n'as encore touché à rien, sinon au moment où tu quittes l'appli.
                        let reloaded = false, pending = false, touched = false;
                        const t0 = Date.now();
                        ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { touched = true; }, { passive: true, once: true }));
                        const unsaved = () => { try { return typeof hasUnsavedEdits !== 'undefined' && hasUnsavedEdits; } catch (e) { return false; } };
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (reloaded) return;
                            if (!touched && Date.now() - t0 < 6000) { reloaded = true; location.reload(); return; }
                            pending = true;
                        });
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'hidden' && pending && !reloaded && !unsaved()) { reloaded = true; location.reload(); }
                        });
                    }
                    // Notifier si une mise à jour est disponible
                    reg.addEventListener('updatefound', () => {
                        const newSW = reg.installing;
                        newSW.addEventListener('statechange', () => {
                            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                // Une nouvelle version est disponible
                                bmShowUpdateBanner();
                            }
                        });
                    });
                })
                .catch(err => console.warn('[SW] Échec enregistrement :', err));
        });
    }
    </script>
